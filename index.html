<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DARI YOGA ANJAY MABAR SLEBEWW</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    .ui-overlay {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      text-align: center;
      z-index: 10;
      width: 90%;
      max-width: 400px;
    }

    .counter-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(10, 25, 50, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 191, 255, 0.3);
      border-radius: 20px;
      font-size: 0.85rem;
      color: #00dfff;
      letter-spacing: 1px;
      margin-bottom: 8px;
      box-shadow: 0 0 15px rgba(0, 191, 255, 0.25);
    }

    .hint-text {
      font-size: 0.8rem;
      color: rgba(180, 220, 255, 0.7);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="ui-overlay">
    <div id="counter" class="counter-badge">Halo Anak Kecil</div>
    <div class="hint-text">Tekan dimana saja</div>
  </div>

  <canvas id="galaxyCanvas"></canvas>

  <script>
    // ========================================================
    // 1. PESAN KATA-KATA BINTANG
    // ========================================================
    const messages = [
      "HALO SHERLYY",         // Klik/Ketuk ke-1
      "SEMANGAT ⭐",           // Klik/Ketuk ke-2
      "NYUSUN PROPOSALNYA ✨",  // Klik/Ketuk ke-3
      "BOI MATE DÕDÕ 🌟",       // Klik/Ketuk ke-4
      "HIDUP JOKOWII !!!"      // Klik/Ketuk ke-5
    ];

    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const counterUI = document.getElementById('counter');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let isMobile = window.innerWidth < 768;
    let particleCount = isMobile ? 1200 : 2200;
    let bgStarCount = isMobile ? 120 : 250;

    let particles = [];
    let bgStars = [];
    let shootingStars = [];
    let currentStep = 0;
    let textCoordinates = [];

    const blueColors = [
      '#00ffff', // Cyan
      '#87cefa', // Light Sky Blue
      '#00bfff', // Deep Sky Blue
      '#e0ffff', // Ice Blue
      '#1e90ff'  // Dodger Blue
    ];

    function getRandomBlue() {
      return blueColors[Math.floor(Math.random() * blueColors.length)];
    }

    // 1. Class Bintang Jatuh (Shooting Star / Meteor)
    class ShootingStar {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * (width * 1.2);
        this.y = -20;
        this.length = Math.random() * (isMobile ? 50 : 80) + 30;
        this.speed = Math.random() * 12 + 15;
        this.size = Math.random() * 1.5 + 0.8;
        this.angle = Math.PI / 4;
        this.opacity = 1;
        this.active = true;
      }

      update() {
        this.x -= Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.opacity -= 0.012;

        if (this.x < -150 || this.y > height + 150 || this.opacity <= 0) {
          this.active = false;
        }
      }

      draw() {
        if (!this.active) return;

        const tailX = this.x + Math.cos(this.angle) * this.length;
        const tailY = this.y - Math.sin(this.angle) * this.length;

        const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
        gradient.addColorStop(0.3, `rgba(0, 223, 255, ${this.opacity * 0.7})`);
        gradient.addColorStop(1, 'rgba(0, 191, 255, 0)');

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.lineWidth = this.size;
        ctx.strokeStyle = gradient;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ffff';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // 2. Class Bintang Latar Belakang
    class BGStar {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.2;
        this.alpha = Math.random();
        this.speed = Math.random() * 0.02 + 0.005;
      }
      draw() {
        this.alpha += this.speed;
        if (this.alpha > 1 || this.alpha < 0.2) this.speed = -this.speed;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180, 230, 255, ${Math.abs(this.alpha)})`;
        ctx.fill();
      }
    }

    // 3. Class Partikel Bintang Utama (PERGERAKAN SANGAT CEPAT & LINSI)
    class Particle {
      constructor() {
        this.resetToSpiral();
        this.x = this.spiralX;
        this.y = this.spiralY;
        this.size = Math.random() * (isMobile ? 1.3 : 1.8) + 0.5;
        this.color = getRandomBlue();
        this.ease = Math.random() * 0.09 + 0.09; // Respon pergerakan super kencang
      }

      resetToSpiral() {
        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * (Math.min(width, height) * (isMobile ? 0.38 : 0.35));
        this.speed = (0.005 + Math.random() * 0.008) * (Math.random() > 0.5 ? 1 : -1);
        this.spiralX = width / 2 + Math.cos(this.angle) * this.radius;
        this.spiralY = height / 2 + Math.sin(this.angle) * this.radius * 0.55;
        this.targetX = this.spiralX;
        this.targetY = this.spiralY;
      }

      update() {
        if (currentStep === 0) {
          this.angle += this.speed;
          this.targetX = width / 2 + Math.cos(this.angle) * this.radius;
          this.targetY = height / 2 + Math.sin(this.angle) * this.radius * 0.55;
        }

        this.x += (this.targetX - this.x) * this.ease;
        this.y += (this.targetY - this.y) * this.ease;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = isMobile ? 2 : 6;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // 4. PEMBENTUKAN TEKS KHUSUS LAYAR HP (ANTI TERPOTONG 100%)
    function getTextCoordinates(text) {
      const offscreen = document.createElement('canvas');
      const offCtx = offscreen.getContext('2d');
      offscreen.width = width;
      offscreen.height = height;

      // Batas aman maksimal 72% lebar HP
      const maxAllowedWidth = width * 0.72;
      let words = text.split(" ");
      let lines = [];
      
      // Khusus HP: pisah otomatis kata menjadi multi-baris
      if (isMobile) {
        if (words.length > 2) {
          lines.push(words[0]);
          lines.push(words.slice(1).join(" "));
        } else if (words.length === 2) {
          lines.push(words[0]);
          lines.push(words[1]);
        } else {
          lines.push(text);
        }
      } else {
        lines.push(text);
      }

      // Hitung ukuran font secara dinamis agar aman di layar HP
      let fontSize = isMobile ? 32 : 65;
      offCtx.font = `bold ${fontSize}px sans-serif`;

      lines.forEach(line => {
        let textWidth = offCtx.measureText(line).width;
        if (textWidth > maxAllowedWidth) {
          let scaledSize = Math.floor((maxAllowedWidth / textWidth) * fontSize);
          if (scaledSize < fontSize) fontSize = scaledSize;
        }
      });

      if (fontSize < 16) fontSize = 16;

      offCtx.font = `bold ${fontSize}px sans-serif`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillStyle = '#ffffff';

      const lineHeight = fontSize * 1.35;
      const startY = height / 2 - ((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, i) => {
        offCtx.fillText(line, width / 2, startY + i * lineHeight);
      });

      const imageData = offCtx.getImageData(0, 0, width, height).data;
      const points = [];
      const density = isMobile ? 2 : 2;

      for (let y = 0; y < height; y += density + 1) {
        for (let x = 0; x < width; x += density + 1) {
          const index = (y * width + x) * 4;
          if (imageData[index + 3] > 128) {
            points.push({ x, y });
          }
        }
      }
      return points;
    }

    function init() {
      particles = [];
      bgStars = [];
      shootingStars = [];

      for (let i = 0; i < bgStarCount; i++) {
        bgStars.push(new BGStar());
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function drawNebula() {
      ctx.fillStyle = '#020208';
      ctx.fillRect(0, 0, width, height);

      const grad1 = ctx.createRadialGradient(width / 2, height / 2, 10, width / 2, height / 2, width * 0.6);
      grad1.addColorStop(0, 'rgba(10, 35, 80, 0.35)');
      grad1.addColorStop(0.5, 'rgba(5, 15, 45, 0.2)');
      grad1.addColorStop(1, 'rgba(2, 2, 8, 0)');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, width, height);
    }

    function handleShootingStars() {
      if (Math.random() < 0.03 && shootingStars.length < 3) {
        shootingStars.push(new ShootingStar());
      }

      shootingStars.forEach((star, index) => {
        star.update();
        star.draw();
        if (!star.active) {
          shootingStars.splice(index, 1);
        }
      });
    }

    function changeShape(e) {
      if (e) e.preventDefault();

      currentStep++;

      if (currentStep > messages.length) {
        currentStep = 0;
      }

      if (currentStep === 0) {
        counterUI.innerText = "Halo Anak Kecil";
        particles.forEach(p => p.resetToSpiral());
      } else {
        counterUI.innerText = `Bintang ${currentStep} dari ${messages.length}`;
        const targetText = messages[currentStep - 1];
        textCoordinates = getTextCoordinates(targetText);

        particles.forEach((p, idx) => {
          if (textCoordinates.length > 0) {
            const targetPt = textCoordinates[idx % textCoordinates.length];
            p.targetX = targetPt.x + (Math.random() - 0.5) * 0.8;
            p.targetY = targetPt.y + (Math.random() - 0.5) * 0.8;
          } else {
            p.resetToSpiral();
          }
        });
      }
    }

    function animate() {
      drawNebula();

      bgStars.forEach(st => st.draw());
      handleShootingStars();

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    let hasTouched = false;

    window.addEventListener('touchstart', (e) => {
      hasTouched = true;
      changeShape(e);
    }, { passive: false });

    window.addEventListener('click', (e) => {
      if (!hasTouched) {
        changeShape(e);
      }
      hasTouched = false;
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      isMobile = window.innerWidth < 768;
      
      if (currentStep === 0) {
        particles.forEach(p => p.resetToSpiral());
      } else {
        const currentText = messages[currentStep - 1];
        textCoordinates = getTextCoordinates(currentText);
        particles.forEach((p, idx) => {
          if (textCoordinates.length > 0) {
            const targetPt = textCoordinates[idx % textCoordinates.length];
            p.targetX = targetPt.x;
            p.targetY = targetPt.y;
          }
        });
      }
    });

    window.onload = () => {
      init();
      animate();
    };
  </script>
</body>
</html>
